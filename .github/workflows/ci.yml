name: ci

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

jobs:
  main:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    strategy:
      matrix:
        type: [alpine, debian]
        node: [18, 20, 22]
    env:
      AZURE_CONTAINER_REGISTRY_URL: hmctspublic.azurecr.io
      NEW_AZURE_CONTAINER_REGISTRY_URL: hmctsprod.azurecr.io
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: 'Az CLI login'
        uses: azure/login@v2
        with:
          client-id: c6a3a50b-762f-4b4f-b7ec-f1d84be20cef # DTS Platform Operations GitHub Actions ACR Publisher 1
          tenant-id: 531ff96d-0ae9-462a-8d2d-bec7c0b42082 # HMCTS.NET
          allow-no-subscriptions: true

      - name: Hadolint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./${{ matrix.type }}/Dockerfile

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      ###################################################
      # Build and Test the image before pushing to ACR(s)
      ###################################################
      - name: 'ACR Login - ${{ env.AZURE_CONTAINER_REGISTRY_URL }} - Node ${{ matrix.node }} ${{ matrix.type }}'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AZURE_CONTAINER_REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 'Build and Test - ${{ env.AZURE_CONTAINER_REGISTRY_URL }} - Node ${{ matrix.node }} ${{ matrix.type }}'
        id: docker_build_test
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.type }}
          load: true
          tags: ${{ env.AZURE_CONTAINER_REGISTRY_URL }}/base/node:pr-${{ matrix.node }}-${{ matrix.type }}
          build-args: |
            NODE_VERSION=${{ matrix.node }}

      - name: 'Test - Node ${{ matrix.node }} ${{ matrix.type }}'
        run: |
          chmod +x ./test-build.sh
          ./test-build.sh ${{ env.AZURE_CONTAINER_REGISTRY_URL }}/base/node pr-${{ matrix.node }}-${{ matrix.type }}
        shell: bash

      ###################################################
      # HMCTSPROD ACR
      ###################################################
      - name: 'ACR Login - ${{ env.NEW_AZURE_CONTAINER_REGISTRY_URL }}'
        run: |
          az acr login --name hmctsprod

      - name: 'Build and push PR image - ${{ env.NEW_AZURE_CONTAINER_REGISTRY_URL }} - Node ${{ matrix.node }} ${{ matrix.type }}'
        if: startsWith(github.ref, 'refs/pull')
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.type }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.NEW_AZURE_CONTAINER_REGISTRY_URL }}/base/node:pr-${{ matrix.node }}-${{ matrix.type }}
          build-args: |
            NODE_VERSION=${{ matrix.node }}

      ###################################################
      # HMCTSPUBLIC ACR - Push
      ###################################################
      - name: 'Build and Push PR image - ${{ env.AZURE_CONTAINER_REGISTRY_URL }} - Node ${{ matrix.node }} ${{ matrix.type }}'
        if: startsWith(github.ref, 'refs/pull')
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.type }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.AZURE_CONTAINER_REGISTRY_URL }}/base/node:pr-${{ matrix.node }}-${{ matrix.type }}
          build-args: |
            NODE_VERSION=${{ matrix.node }}
